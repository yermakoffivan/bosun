name: Bosun
options:
  bundleIdPrefix: dev.yetidevworks
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BosunCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_NAME: BosunCore
        PRODUCT_MODULE_NAME: BosunCore
        SKIP_INSTALL: YES
  Bosun:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - target: BosunCore
      - framework: ../../../ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yetidevworks.bosun-mac
        PRODUCT_NAME: Bosun
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Bosun
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Andy Miller"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: ["-lc++"]
    postBuildScripts:
      - name: Bundle Ghostty resources (terminfo + themes)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SHARE="${PROJECT_DIR}/../../../ghostty/zig-out/share"
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RES"
          rsync -a --delete "$SHARE/terminfo/" "$RES/terminfo/"
          rsync -a --delete "$SHARE/ghostty/" "$RES/ghostty/"
  BosunCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: BosunCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yetidevworks.bosun-mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bosun:
    build:
      targets:
        Bosun: all
        BosunCore: all
    test:
      targets:
        - BosunCoreTests
