# tmux config for the throwaway -L bosun-spike server (never the default or -L bosun socket).
set -g window-size latest
set -g aggressive-resize off
set -g status on
set -g history-limit 5000
set -g mouse on
set -g default-terminal "tmux-256color"
set -g escape-time 0
# Full session name in the status line so the selftest can recognise a session's first real frame.
set -g status-left "[#{session_name}] "
set -g status-left-length 40
