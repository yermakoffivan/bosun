name: BosunSpike
options:
  bundleIdPrefix: dev.yetidevworks
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  BosunSpike:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - framework: ../../../ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yetidevworks.bosun-spike
        PRODUCT_NAME: BosunSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Bosun Spike
        OTHER_LDFLAGS: ["-lc++"]
    postBuildScripts:
      - name: Bundle Ghostty resources (terminfo + themes)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SHARE="${PROJECT_DIR}/../../../ghostty/zig-out/share"
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RES"
          rsync -a --delete "$SHARE/terminfo/" "$RES/terminfo/"
          rsync -a --delete "$SHARE/ghostty/" "$RES/ghostty/"
